<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Articles</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="sidebar">
    <h2 class="sidebar__title">Articles</h2>
    <ul class="sidebar__list">
      <li><a class="sidebar__link is-active" href="articles/ai-coding-agents.html" target="article-frame">AI Coding Agents</a></li>
    </ul>
  </nav>

  <main class="content">
    <iframe class="content__frame" name="article-frame" src="articles/ai-coding-agents.html" title="Article content"></iframe>
  </main>

  <script>
    document.querySelectorAll('.sidebar__link').forEach(link => {
      link.addEventListener('click', () => {
        document.querySelectorAll('.sidebar__link').forEach(l => l.classList.remove('is-active'));
        link.classList.add('is-active');
      });
    });
  </script>

</body>
</html>
