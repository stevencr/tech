<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Tech Notes</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <button class="menu-toggle" type="button" aria-label="Open article menu" aria-controls="article-nav" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a class="brand" href="./" aria-label="Tech Notes home">
      <span class="brand__mark" aria-hidden="true">&lt;/&gt;</span>
      <span><span class="brand__name">Tech Notes</span><span class="brand__tagline">by Steven Cranfield</span></span>
    </a>
    <div class="header-actions">
      <div class="theme-picker">
        <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true">☾</span><span class="theme-toggle__label">Dark</span>
        </button>
      </div>
      <span class="brand__status"><span></span> Developer journal</span>
    </div>
  </header>
  <div class="app-shell">
    <nav class="sidebar" id="article-nav" aria-label="Articles">
      <div class="sidebar__heading"><span>Library</span><span class="sidebar__count">02</span></div>
      <ul class="sidebar__list">
        <li><a class="sidebar__link is-active" href="articles/usb-serial-communications.html" target="article-frame"><span class="sidebar__number">01</span><span class="sidebar__copy"><strong>USB & Serial Comms</strong><small>Protocols under the cable</small></span></a></li>
        <li><a class="sidebar__link" href="articles/advanced-typescript.html" target="article-frame"><span class="sidebar__number">02</span><span class="sidebar__copy"><strong>Advanced TypeScript</strong><small>The type system under the hood</small></span></a></li>
      </ul>
    </nav>
    <main class="content">
      <div class="content__chrome"><span>ARTICLE</span><span class="content__dot"></span><span>READING MODE</span></div>
      <iframe class="content__frame" name="article-frame" src="articles/usb-serial-communications.html" title="Article content"></iframe>
    </main>
  </div>
  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const sidebar = document.querySelector('.sidebar');
    const links = document.querySelectorAll('.sidebar__link');
    const themeToggle = document.querySelector('.theme-toggle');
    const frame = document.querySelector('.content__frame');
    const themes = {
      dark: { bg:'#080b14', surface:'#101522', hover:'#1a2235', text:'#f5f7fb', muted:'#8f9bb0', accent:'#8b96ff', bright:'#b3baff', cyan:'#56d9ff' },
      light: { bg:'#f6f7fb', surface:'#ffffff', hover:'#eef1f7', text:'#18202f', muted:'#667085', accent:'#4f46e5', bright:'#3730a3', cyan:'#0891b2' }
    };
    function setMenu(open) {
      document.body.classList.toggle('nav-open', open);
      menuToggle.setAttribute('aria-expanded', String(open));
      menuToggle.setAttribute('aria-label', open ? 'Close article menu' : 'Open article menu');
    }
    function applyTheme(name) {
      const theme = themes[name] || themes.dark;
      document.documentElement.dataset.theme = name;
      Object.entries(theme).forEach(([key, value]) => {
        document.documentElement.style.setProperty('--' + key.replace('bright','accent-bright').replace('muted','text-muted'), value);
      });
      document.documentElement.style.setProperty('--accent-soft', theme.accent + '20');
      localStorage.setItem('tech-notes-theme', name);
      themeToggle.setAttribute('aria-pressed', String(name === 'light'));
      themeToggle.querySelector('.theme-toggle__icon').textContent = name === 'light' ? '☀' : '☾';
      themeToggle.querySelector('.theme-toggle__label').textContent = name === 'light' ? 'Light' : 'Dark';
      document.querySelector('meta[name="theme-color"]').content = theme.bg;
      syncArticleTheme();
    }
    function syncArticleTheme() {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const themeName = document.documentElement.dataset.theme || 'dark';
        const theme = themes[themeName] || themes.dark;
        let style = doc.getElementById('tech-notes-theme');
        if (!style) {
          style = doc.createElement('style');
          style.id = 'tech-notes-theme';
          doc.head.appendChild(style);
        }
        style.textContent = \`
          :root { color-scheme: \${themeName === 'light' ? 'light' : 'dark'}; }
          body { background: \${theme.bg} !important; color: \${theme.text} !important; }
          h1, h2, h3, strong { color: \${theme.text} !important; }
          p, li { color: \${theme.muted} !important; }
          .meta, .article__meta { color: \${theme.muted} !important; }
          code { background: \${theme.surface} !important; color: \${theme.text} !important; }
          pre { background: \${theme.surface} !important; color: \${theme.text} !important; }
        \`;
      } catch (_) {}
    }
    menuToggle.addEventListener('click', () => setMenu(!document.body.classList.contains('nav-open')));
    links.forEach(link => link.addEventListener('click', () => {
      links.forEach(item => item.classList.remove('is-active'));
      link.classList.add('is-active');
      setMenu(false);
    }));
    themeToggle.addEventListener('click', () => applyTheme((document.documentElement.dataset.theme || 'dark') === 'dark' ? 'light' : 'dark'));
    window.addEventListener('resize', () => { if (window.innerWidth >= 700) setMenu(false); });
    frame.addEventListener('load', syncArticleTheme);
    applyTheme(localStorage.getItem('tech-notes-theme') === 'light' ? 'light' : 'dark');
  </script>
</body>
</html>
